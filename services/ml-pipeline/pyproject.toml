[tool.poetry]
name = "ml-pipeline"
version = "0.1.0"
description = "ML Pipeline Service - Training, Evaluation, and Deployment"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "src", from = "." }
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.23.0,<2.0.0"
mlflow = "^2.10.0"
scikit-learn = "^1.3.0"
pandas = "^2.1.0"
pyyaml = "^6.0"
numexpr = "^2.8.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
