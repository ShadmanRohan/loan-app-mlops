services:
  ml-pipeline:
    build: ../services/ml-pipeline
    volumes:
      - ../local_storage/mlflow:/opt/mlflow
      - ../local_storage/data:/opt/data
    environment:
      MLFLOW_TRACKING_URI: sqlite:////opt/mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /opt/mlflow/mlruns

  prediction-api:
    build: ../services/prediction-api
    ports:
      - "8000:8000"
    volumes:
      # New mount for models (will populate later)
      - ../local_storage/models:/opt/models:ro
    environment:
      # Prefer new path, fallback code will still read legacy until we migrate
      MODEL_PATH: /opt/models/champion/model.joblib
      LABEL_ENCODERS_PATH: /opt/models/champion/label_encoders.joblib

  monitoring:
    build: ../services/monitoring
    ports:
      - "8501:8501"
    volumes:
      - ../local_storage/mlflow:/opt/mlflow:ro
      - ../local_storage/data:/opt/data:ro
